<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>OCTAVO CORTE — Terminal de recuperación</title>
  <meta name="google-site-verification" content="inBNKd0ATP2W5CGQNyAr4o6dyH6M8tYz-BLbojPlr8Y" />
  <meta name="description" content="OCTAVO CORTE — Terminal de recuperación. Una experiencia interactiva de terror psicológico vinculada al universo de EL ECO DEL CARMESÍ.">
  <link rel="canonical" href="https://ecocarmesi.github.io/">
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&family=Special+Elite&display=swap');

:root{
  --black:#0b0a08;
  --bg1:#17150f;
  --bg2:#211e17;
  --mid:#54503f;
  --mid-dark:#302c22;
  --paper:#cfc6a8;
  --paper-dark:#b9af8e;
  --ink:#d8d3c0;
  --ink-dim:#948d76;
  --crimson:#7a1620;
  --crimson-bright:#a8202f;
  --crimson-dim:#4a1017;
}

*{box-sizing:border-box;}
html,body{height:100%; overscroll-behavior:none;}
body{
  margin:0;
  background:var(--black);
  color:var(--ink);
  font-family:'VT323', monospace;
  overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
button{font-family:inherit; touch-action:manipulation;}
:focus-visible{outline:2px solid var(--crimson-bright); outline-offset:2px;}

/* ============ BOOT SCREEN ============ */
#boot{
  position:fixed; inset:0; background:#050403; color:#c9c4ac;
  font-family:'VT323', monospace; font-size:20px; line-height:1.5;
  padding:36px; z-index:9999; display:flex; flex-direction:column;
}
#boot-text{ white-space:pre-wrap; flex:1; margin:0; }
#boot-enter{
  display:none; align-self:flex-start; margin-top:18px;
  background:transparent; border:1px solid var(--ink-dim); color:var(--ink);
  font-family:'VT323', monospace; font-size:22px; padding:8px 22px;
  cursor:pointer; letter-spacing:2px;
}
#boot-enter:hover{ background:var(--crimson-dim); border-color:var(--crimson-bright); }
#boot.hidden{display:none;}
#boot .cursor{ display:inline-block; width:9px; height:18px; background:#c9c4ac; vertical-align:middle; animation:blink 1s steps(1) infinite; }
@keyframes blink{ 50%{opacity:0;} }

/* ============ DESKTOP ============ */
#desktop{ position:fixed; inset:0; background:var(--bg1); overflow:hidden; }
#desktop[hidden]{display:none;}

.crt{
  position:absolute; inset:0; pointer-events:none; z-index:500;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 2px, transparent 3px);
  mix-blend-mode:multiply;
}
.vignette{
  position:absolute; inset:0; pointer-events:none; z-index:501;
  box-shadow: inset 0 0 140px 40px rgba(0,0,0,0.75);
}
.noise{
  position:absolute; inset:0; pointer-events:none; z-index:499; opacity:0.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.bell-watermark{
  position:absolute; right:4%; top:8%; width:46vh; height:46vh; max-width:60%;
  opacity:0.035; z-index:1; pointer-events:none; color:var(--paper);
}
.bell-watermark svg{width:100%; height:100%;}

/* ============ DESKTOP ICONS ============ */
#icons{
  position:absolute; top:26px; left:22px; bottom:78px; width:1px;
  display:flex; flex-direction:column; flex-wrap:wrap; align-content:flex-start;
  gap:20px 6px; z-index:5;
}
.desktop-icon, .trash-icon{
  width:96px; background:none; border:1px solid transparent; color:var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 4px;
  cursor:pointer;
}
.desktop-icon:hover, .trash-icon:hover{ border:1px dotted var(--ink-dim); }
.desktop-icon:active{ background:rgba(255,255,255,0.04); }
.icon-svg{ width:40px; height:40px; color:var(--paper-dark); position:relative; }
.icon-wrap{ position:relative; width:40px; height:40px; }
.icon-wrap .icon-svg{ width:100%; height:100%; }
.lock-badge{ position:absolute; right:-6px; bottom:-6px; width:20px; height:20px; color:var(--crimson-bright); }
.desktop-icon span, .trash-icon span{
  font-family:'VT323', monospace; font-size:16px; letter-spacing:0.5px; text-align:center;
  color:var(--ink); text-shadow:0 1px 2px #000; line-height:1.15;
}
.trash-icon{ position:absolute; right:28px; bottom:86px; }

/* ============ WINDOWS ============ */
#windows{ position:absolute; inset:0; z-index:10; pointer-events:none; }
.window{
  position:absolute; width:440px; min-height:320px; max-height:80vh;
  background:var(--bg2); border:2px solid var(--mid);
  box-shadow: 3px 3px 0 rgba(0,0,0,0.6), inset 0 0 0 1px #000;
  display:flex; flex-direction:column; pointer-events:auto;
}
.window.danger{ border-color:var(--crimson-dim); }
.window.active{ border-color:var(--ink-dim); }
.window.active.danger{ border-color:var(--crimson-bright); }
.titlebar{
  background:linear-gradient(180deg, #3a362a, #211e17);
  color:var(--paper); padding:6px 8px; display:flex; align-items:center; gap:8px;
  border-bottom:2px solid var(--black); cursor:move; touch-action:none;
}
.window.danger .titlebar{ background:linear-gradient(180deg, #3a1a1e, #1c0d0f); color:#e7d9d9; }
.titlebar-icon{ width:18px; height:18px; flex:none; display:flex; }
.titlebar-icon svg{ width:100%; height:100%; }
.titlebar-text{ flex:1; font-size:18px; letter-spacing:0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.titlebar-btns{ display:flex; gap:4px; }
.titlebar-btns button{
  width:22px; height:20px; background:var(--mid-dark); color:var(--ink); border:1px solid #000;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.15), inset -1px -1px 0 rgba(0,0,0,0.5);
  font-size:13px; line-height:1; cursor:pointer; padding:0;
}
.titlebar-btns button:active{ box-shadow: inset -1px -1px 0 rgba(255,255,255,0.15), inset 1px 1px 0 rgba(0,0,0,0.5); }
.win-body{
  flex:1; overflow-y:auto; padding:16px; position:relative;
  background:var(--bg2);
}

/* folder listing */
.folder-body{ display:flex; flex-wrap:wrap; align-content:flex-start; gap:14px; }
.file-icon{
  width:92px; background:none; border:1px solid transparent; color:var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 4px; cursor:pointer;
}
.file-icon:hover{ border:1px dotted var(--ink-dim); }
.file-icon .icon-wrap{ width:36px; height:36px; }
.file-icon span{ font-size:14px; text-align:center; word-break:break-word; line-height:1.2; }
.folder-empty-note{ font-family:'VT323'; color:var(--ink-dim); font-size:16px; }

/* documents */
.doc-body{ background:var(--paper); color:#2b2620; padding:22px; }
.doc-text{
  font-family:'Special Elite', 'Courier New', monospace; font-size:15px; line-height:1.75;
  white-space:pre-wrap; margin:0; color:#2b2620;
}
.redacted{ background:#151310; color:#151310; padding:0 2px; }
.doc-body .bell-stamp{
  position:absolute; top:10px; right:14px; width:64px; height:64px; opacity:0.55; color:var(--crimson);
  transform:rotate(8deg);
}
.doc-body .bell-stamp svg{ width:100%; height:100%; }

/* photos */
.photo-frame{
  width:100%; max-width:400px; margin:0 auto; position:relative; overflow:hidden;
  box-shadow:2px 2px 0 rgba(0,0,0,0.6); background:#0d0b09; line-height:0;
}
.photo-img{ width:100%; height:auto; display:block; }
.photo-frame.corrupt .photo-img{ animation:glitch 2.4s steps(2) infinite; }
@media (prefers-reduced-motion:reduce){ .photo-frame.corrupt .photo-img{ animation:none; } }
@keyframes glitch{ 0%,100%{ filter:none; } 40%{ filter:hue-rotate(15deg) contrast(1.25); transform:translateX(2px);} 60%{ transform:translateX(-2px);} }
.photo-thumb{ overflow:hidden; background:#0d0b09; border:1px solid #000; }
.photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

/* locked content */
.lock-body{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; padding-top:6px; }
.lock-icon{ width:56px; height:56px; color:var(--crimson-bright); }
.lock-msg{ font-family:'VT323'; font-size:17px; color:var(--ink); line-height:1.5; max-width:320px; }
.lock-form{ display:flex; gap:8px; margin-top:6px; }
.lock-input{
  background:var(--black); border:1px solid var(--mid); color:var(--ink); font-family:'VT323';
  font-size:17px; padding:6px 8px; width:160px; letter-spacing:2px;
}
.lock-btn{
  background:var(--mid-dark); color:var(--ink); border:1px solid #000; font-family:'VT323'; font-size:16px;
  padding:6px 12px; cursor:pointer; box-shadow: inset 1px 1px 0 rgba(255,255,255,0.12);
}
.lock-btn:hover{ border-color:var(--crimson-bright); }
.lock-error{ color:var(--crimson-bright); font-family:'VT323'; font-size:17px; letter-spacing:1px; }

/* restricted folder */
.restricted-note{ font-family:'VT323'; font-size:15px; color:var(--ink-dim); max-width:320px; }

/* ============ TASKBAR ============ */
#taskbar{
  position:absolute; left:0; right:0; bottom:0; height:46px; z-index:600;
  background:linear-gradient(180deg,#2a271e,#17150f); border-top:2px solid var(--mid);
  display:flex; align-items:center; padding:0 8px; gap:8px;
}
#start-btn{
  background:var(--mid-dark); color:var(--ink); border:1px solid #000; font-family:'VT323';
  font-size:18px; padding:6px 14px; cursor:pointer; letter-spacing:1px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.12);
}
#start-menu{
  position:absolute; bottom:46px; left:8px; background:var(--bg2); border:1px solid var(--mid);
  box-shadow:2px 2px 0 rgba(0,0,0,0.6); min-width:220px; padding:6px 0; display:none; z-index:700;
}
#start-menu.open{ display:block; }
#start-menu button{
  display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink);
  font-family:'VT323'; font-size:17px; padding:8px 16px; cursor:pointer;
}
#start-menu button:hover{ background:var(--mid-dark); }
#taskbar-windows{ flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; height:100%; align-items:center; }
.taskbar-item{
  background:var(--mid-dark); color:var(--ink); border:1px solid #000; font-family:'VT323';
  font-size:14px; padding:5px 10px; cursor:pointer; max-width:150px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; flex:none;
}
.taskbar-item.blink{ animation:tblink 1s steps(2) 3; }
@keyframes tblink{ 50%{ background:var(--crimson-dim); } }
#clock{ font-family:'VT323'; font-size:17px; color:var(--ink); letter-spacing:1px; flex:none; padding:0 6px; }

/* ============ ERROR / SYSTEM POPUPS ============ */
#popup-layer{ position:fixed; inset:0; z-index:9000; pointer-events:none; }
.error-popup{
  position:absolute; width:300px; max-width:88vw; background:var(--bg2); border:2px solid var(--crimson-dim);
  box-shadow:4px 4px 0 rgba(0,0,0,0.7); pointer-events:auto;
  left:50%; top:32%; transform:translate(-50%,-50%);
}
.error-titlebar{
  background:linear-gradient(180deg,#3a1a1e,#1c0d0f); color:#e7d9d9; padding:6px 10px;
  font-family:'VT323'; font-size:16px; display:flex; align-items:center; gap:6px;
  border-bottom:2px solid #000;
}
.error-titlebar svg{ width:16px; height:16px; }
.error-body{ display:flex; gap:12px; padding:16px; align-items:flex-start; }
.error-icon{
  flex:none; width:34px; height:34px; border-radius:50%; background:var(--crimson-bright); color:#1a0507;
  font-family:'VT323'; font-size:24px; font-weight:bold; display:flex; align-items:center; justify-content:center;
}
.error-body p{ font-family:'VT323'; font-size:16px; margin:0; line-height:1.5; color:var(--ink); }
.error-actions{ text-align:right; padding:0 16px 14px; }
.error-actions button{
  background:var(--mid-dark); color:var(--ink); border:1px solid #000; font-family:'VT323'; font-size:15px;
  padding:5px 16px; cursor:pointer;
}
.error-actions button:hover{ border-color:var(--crimson-bright); }

/* ============ MOBILE / TABLET ============ */
@media (max-width:720px){
  #taskbar{ height:58px; padding:0 6px; gap:6px; }
  #start-btn{ font-size:16px; padding:7px 10px; flex:none; }
  #clock{ font-size:16px; padding:0 4px; }
  #taskbar-windows{ max-width:38vw; gap:5px; }
  .taskbar-item{ font-size:13px; padding:5px 8px; max-width:110px; }

  #icons{
    position:absolute; top:14px; left:8px; right:70px; bottom:72px; width:auto; height:auto;
    flex-direction:row; flex-wrap:wrap; align-content:flex-start; justify-content:flex-start;
    gap:14px 8px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px;
  }
  .desktop-icon{ width:78px; }
  .desktop-icon span{ font-size:15px; }
  .trash-icon{ position:absolute; right:6px; bottom:72px; width:64px; }

  .window{
    left:2% !important; top:6px !important; width:96% !important; max-height:none;
    height:calc(100% - 78px);
  }
  .titlebar{ cursor:default; padding:8px 8px; }
  .titlebar-text{ font-size:17px; }
  .titlebar-btns button{ width:36px; height:32px; font-size:17px; }
  .doc-body{ padding:16px; }
  .doc-text{ font-size:15px; }
  .file-icon{ width:82px; }
  .lock-form{ flex-wrap:wrap; justify-content:center; }
  .lock-input{ width:min(190px, 56vw); }
  #start-menu{ min-width:200px; }
}

@media (max-width:380px){
  #taskbar-windows{ display:none; }
  #icons{ right:64px; }
}
</style>
</head>
<body>

<div id="boot">
  <pre id="boot-text"></pre>
  <button id="boot-enter">[ ENTRAR ]</button>
</div>

<div id="desktop" hidden>
  <div class="noise"></div>
  <div class="bell-watermark">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <path fill="currentColor" d="M50 6c-17 0-24 17-24 34 0 10-2 18-9 30h66c-7-12-9-20-9-30 0-17-7-34-24-34z"/>
      <rect fill="currentColor" x="41" y="70" width="18" height="9"/>
      <circle fill="currentColor" cx="50" cy="86" r="6"/>
    </svg>
  </div>

  <div id="icons"></div>
  <button class="trash-icon" id="trash-icon" aria-label="Papelera">
    <span class="icon-wrap">
      <svg class="icon-svg" viewBox="0 0 48 56" xmlns="http://www.w3.org/2000/svg">
        <rect fill="currentColor" x="6" y="14" width="36" height="38"/>
        <rect fill="currentColor" x="2" y="8" width="44" height="6"/>
        <rect fill="currentColor" x="18" y="2" width="12" height="6"/>
        <line x1="16" y1="21" x2="16" y2="46" stroke="#0b0a08" stroke-width="2"/>
        <line x1="24" y1="21" x2="24" y2="46" stroke="#0b0a08" stroke-width="2"/>
        <line x1="32" y1="21" x2="32" y2="46" stroke="#0b0a08" stroke-width="2"/>
      </svg>
    </span>
    <span>Papelera</span>
  </button>

  <div id="windows"></div>

  <div class="vignette"></div>
  <div class="crt"></div>

  <div id="taskbar">
    <button id="start-btn">☰ MENÚ</button>
    <div id="start-menu">
      <button id="menu-about">Acerca de este equipo</button>
      <button id="menu-close-all">Cerrar todas las ventanas</button>
    </div>
    <div id="taskbar-windows"></div>
    <div id="clock">--:--:--</div>
  </div>
</div>

<div id="popup-layer"></div>

<script>
(function(){
"use strict";

/* ============================================================
   ICONOS SVG
   ============================================================ */
function folderIcon(locked){
  return '<span class="icon-wrap"><svg class="icon-svg" viewBox="0 0 64 52" xmlns="http://www.w3.org/2000/svg">'
    + '<path fill="currentColor" d="M2 10 H26 L32 4 H62 V46 H2 Z"/></svg>'
    + (locked ? '<svg class="lock-badge" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="9" width="12" height="9" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2" d="M6 9 V6 a4 4 0 0 1 8 0 V9"/></svg>' : '')
    + '</span>';
}
function docIconInner(){
  return '<svg class="icon-svg" viewBox="0 0 48 60" xmlns="http://www.w3.org/2000/svg">'
    + '<path fill="currentColor" opacity="0.92" d="M4 2 H30 L44 16 V58 H4 Z"/>'
    + '<path fill="currentColor" opacity="0.5" d="M30 2 V16 H44 Z"/></svg>';
}
function photoIconInner(){
  return '<svg class="icon-svg" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">'
    + '<rect x="2" y="2" width="44" height="44" fill="none" stroke="currentColor" stroke-width="3"/>'
    + '<circle cx="15" cy="15" r="5" fill="currentColor"/>'
    + '<path fill="currentColor" d="M4 40 L18 24 L27 34 L36 22 L45 40 Z"/></svg>';
}
function lockBadgeSVG(){
  return '<svg class="lock-badge" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="9" width="12" height="9" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2" d="M6 9 V6 a4 4 0 0 1 8 0 V9"/></svg>';
}
function docIcon(){ return '<span class="icon-wrap">'+docIconInner()+'</span>'; }
function lockedDocIcon(){ return '<span class="icon-wrap">'+docIconInner()+lockBadgeSVG()+'</span>'; }
function photoIcon(locked){ return '<span class="icon-wrap">'+photoIconInner()+(locked?lockBadgeSVG():'')+'</span>'; }
function bellIconSmall(){
  return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M20 4c-8 0-11 8-11 16 0 5-1 9-4 14h30c-3-5-4-9-4-14 0-8-3-16-11-16z"/><rect fill="currentColor" x="16" y="34" width="8" height="4"/></svg>';
}
function bellStamp(){
  return '<div class="bell-stamp">'+bellIconSmall()+'</div>';
}
function lockIconBig(){
  return '<svg class="lock-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="7" y="18" width="26" height="19" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="3" d="M11 18 V12 a9 9 0 0 1 18 0 V18"/></svg>';
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let zTop = 10;

function uid(prefix){ winSeq++; return prefix+'_'+winSeq; }
function isMobile(){ return window.matchMedia('(max-width:720px)').matches; }

let audioCtx;
function playBeep(freq, dur){
  freq = freq || 440; dur = dur || 0.08;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.value = 0.035;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur+0.03);
  }catch(e){ /* audio no disponible, se ignora */ }
}

/* ============================================================
   VENTANAS
   ============================================================ */
function bringToFront(win){
  zTop++;
  win.style.zIndex = zTop;
  document.querySelectorAll('.window').forEach(function(w){ w.classList.remove('active'); });
  win.classList.add('active');
}

function cascadePosition(){
  const n = document.querySelectorAll('.window').length;
  const baseX = 60 + (n%6)*28;
  const baseY = 40 + (n%6)*24;
  return { x: baseX, y: baseY };
}

function addToTaskbar(id, title){
  const tb = document.getElementById('taskbar-windows');
  const btn = document.createElement('button');
  btn.className = 'taskbar-item';
  btn.dataset.win = id;
  btn.textContent = title.length>16 ? title.slice(0,16)+'…' : title;
  btn.onclick = function(){
    const win = document.getElementById(id);
    if(!win) return;
    win.style.display = 'flex';
    bringToFront(win);
  };
  tb.appendChild(btn);
}
function removeFromTaskbar(id){
  const b = document.querySelector('.taskbar-item[data-win="'+id+'"]');
  if(b) b.remove();
}
function closeWindow(id){
  const w = document.getElementById(id);
  if(w) w.remove();
  removeFromTaskbar(id);
}
function minimizeWindow(id){
  const w = document.getElementById(id);
  if(w) w.style.display = 'none';
}

function enableDrag(win){
  const bar = win.querySelector('.titlebar');
  const btns = win.querySelector('.titlebar-btns');
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  bar.addEventListener('pointerdown', function(e){
    if(isMobile()) return;
    if(btns.contains(e.target)) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = win.offsetLeft; oy = win.offsetTop;
    try{ bar.setPointerCapture(e.pointerId); }catch(err){}
    bringToFront(win);
  });
  bar.addEventListener('pointermove', function(e){
    if(!dragging) return;
    let nx = ox + (e.clientX - sx);
    let ny = oy + (e.clientY - sy);
    nx = Math.max(-40, Math.min(nx, window.innerWidth-80));
    ny = Math.max(0, Math.min(ny, window.innerHeight-90));
    win.style.left = nx+'px';
    win.style.top = ny+'px';
  });
  function endDrag(){ dragging=false; }
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', endDrag);
}

function makeWindowShell(title, danger){
  const id = uid('win');
  const win = document.createElement('div');
  win.className = 'window'+(danger?' danger':'');
  win.id = id;
  const pos = cascadePosition();
  if(isMobile()){
    win.style.left = '2%'; win.style.top = '8px';
  } else {
    win.style.left = pos.x+'px'; win.style.top = pos.y+'px';
  }
  win.innerHTML =
    '<div class="titlebar">'
      +'<span class="titlebar-icon">'+(danger?bellIconSmall():docIconInner())+'</span>'
      +'<span class="titlebar-text"></span>'
      +'<div class="titlebar-btns">'
        +'<button class="btn-min" aria-label="Minimizar" title="Minimizar">_</button>'
        +'<button class="btn-close" aria-label="Cerrar" title="Cerrar">✕</button>'
      +'</div>'
    +'</div>'
    +'<div class="win-body"></div>';
  win.querySelector('.titlebar-text').textContent = title;
  document.getElementById('windows').appendChild(win);
  enableDrag(win);
  win.querySelector('.btn-close').onclick = function(){ closeWindow(id); };
  win.querySelector('.btn-min').onclick = function(){ minimizeWindow(id); };
  win.addEventListener('pointerdown', function(){ bringToFront(win); });
  addToTaskbar(id, title);
  bringToFront(win);
  return win;
}

/* ---- abrir carpeta ---- */
function openFolder(key){
  const folder = FOLDERS[key];
  if(folder.restricted){ openRestrictedFolder(key, folder); return; }
  const win = makeWindowShell(folder.label);
  const body = win.querySelector('.win-body');
  body.classList.add('folder-body');
  folder.files.forEach(function(f){
    const item = document.createElement('button');
    item.className = 'file-icon';
    let icon;
    const isPhotoFile = /\.(JPG|JPEG|PNG)$/i.test(f.name);
    if(f.img){
      icon = '<span class="icon-wrap photo-thumb"><img src="'+f.img+'" alt="" loading="lazy"></span>';
    } else if(f.type==='photo'){
      icon = photoIcon(false);
    } else if(f.type==='locked' && isPhotoFile){
      icon = photoIcon(true);
    } else if(f.type==='locked'){
      icon = lockedDocIcon();
    } else {
      icon = docIcon();
    }
    item.innerHTML = icon + '<span>'+escapeHtml(f.name)+'</span>';
    item.onclick = function(){ openFile(f); };
    body.appendChild(item);
  });

  if(key==='fotos' && !seenFolder.has('fotos')){
    seenFolder.add('fotos');
    setTimeout(function(){
      spawnError("El sistema detectó un intento de restaurar un archivo de imagen dañado. Proceda con precaución.");
    }, 2600);
  }
}

/* ---- abrir archivo ---- */
function openFile(f){
  if(f.type==='locked' && !unlocked.has(f.id)){
    openLockedFile(f);
    return;
  }
  const win = makeWindowShell(f.title, f.danger);
  const body = win.querySelector('.win-body');
  if(f.type==='photo'){
    body.innerHTML =
      '<div class="photo-frame'+(f.corrupt?' corrupt':'')+'">'
        +'<img class="photo-img" src="'+f.img+'" alt="'+escapeHtml(f.body)+'">'
      +'</div>';
  } else {
    body.classList.add('doc-body');
    let html = f.stamp ? bellStamp() : '';
    html += '<pre class="doc-text">'+renderDocText(f.body)+'</pre>';
    body.innerHTML = html;
  }
}

function renderDocText(text){
  const escaped = escapeHtml(text);
  return escaped.replace(/\[\[REDACTED\]\]/g, '<span class="redacted">████████ ██████████ ████ ██████████████ ████ ██████.</span>');
}

/* ---- archivo bloqueado con contraseña ---- */
function openLockedFile(f){
  const win = makeWindowShell(f.title);
  const body = win.querySelector('.win-body');
  body.classList.add('lock-body');

  if(f.noSolution){
    if(f.img){
      body.classList.remove('lock-body');
      body.innerHTML = '<div class="photo-frame"><img class="photo-img" src="'+f.img+'" alt="'+escapeHtml(f.body)+'"></div>';
    } else {
      body.innerHTML =
        lockIconBig()
        +'<p class="lock-msg">Esta imagen fue protegida manualmente por su propietario.<br>No existe una clave asociada a este archivo en el sistema.</p>';
    }
    return;
  }

  body.innerHTML =
    lockIconBig()
    +'<p class="lock-msg">Este archivo está protegido con contraseña.</p>'
    +'<div class="lock-form">'
      +'<input type="text" class="lock-input" placeholder="CONTRASEÑA" autocomplete="off" spellcheck="false">'
      +'<button class="lock-btn">DESBLOQUEAR</button>'
    +'</div>'
    +'<p class="lock-error" hidden>ACCESO DENEGADO</p>';

  const input = body.querySelector('.lock-input');
  const btn = body.querySelector('.lock-btn');
  const err = body.querySelector('.lock-error');

  function tryUnlock(){
    const val = input.value.trim().toUpperCase();
    if(val === f.password){
      unlocked.add(f.id);
      body.classList.remove('lock-body');
      let html = f.stamp ? bellStamp() : '';
      html += '<pre class="doc-text">'+renderDocText(f.body)+'</pre>';
      body.innerHTML = html;
    } else {
      err.hidden = false;
      playBeep(140, 0.16);
      input.value = '';
      input.focus();
    }
  }
  btn.onclick = tryUnlock;
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
}

function openRestrictedFolder(key, folder){
  const win = makeWindowShell(folder.label, true);

      +'<button class="lock-btn">INTENTAR</button>'
    +'</div>'
    +'<p class="lock-error" hidden>ACCESO DENEGADO</p>';

  const input = body.querySelector('.lock-input');

  };
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter') body.querySelector('.lock-btn').click();
  });
}

/* ============================================================

   ============================================================ */
function spawnError(msg){
  const layer = document.getElementById('popup-layer');
  const id = uid('err');
  const div = document.createElement('div');
  div.className = 'error-popup';
  div.id = id;
  const offset = (document.querySelectorAll('.error-popup').length)*22;
  div.style.top = (38+ (offset/10)) + '%';
  div.style.marginLeft = offset+'px';
  div.innerHTML =
    '<div class="error-titlebar">'+bellIconSmall()+'<span>Mensaje del sistema</span></div>'
    +'<div class="error-body"><div class="error-icon">!</div><p></p></div>'
    +'<div class="error-actions"><button>ACEPTAR</button></div>';
  div.querySelector('.error-body p').textContent = msg;
  layer.appendChild(div);
  playBeep(880, 0.06);
  div.querySelector('.error-actions button').onclick = function(){ div.remove(); };
}

function scheduleRandomError(){
  const delay = 75000 + Math.random()*55000;
  setTimeout(function(){
    spawnError(ERR_POOL[Math.floor(Math.random()*ERR_POOL.length)]);
    scheduleRandomError();
  }, delay);
}

function tickClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = 'VIE 03 OCT   '+hh+':'+mm+':'+ss;
}

function renderIcons(){
  const cont = document.getElementById('icons');
  DESKTOP_ICONS.forEach(function(ic){
    const btn = document.createElement('button');
    btn.className = 'desktop-icon';
    btn.innerHTML = folderIcon(ic.locked) + '<span>'+ic.label+'</span>';
    btn.onclick = function(){ openFolder(ic.key); };
    cont.appendChild(btn);
  });
}

function initDesktop(){
  renderIcons();
  document.getElementById('trash-icon').onclick = openTrash;
  tickClock();
  setInterval(tickClock, 1000);
  scheduleRandomError();

  const startBtn = document.getElementById('start-btn');
  const startMenu = document.getElementById('start-menu');
  startBtn.onclick = function(){ startMenu.classList.toggle('open'); };
  document.getElementById('menu-about').onclick = function(){
    startMenu.classList.remove('open');
    const win = makeWindowShell('Acerca de este equipo');
    const body = win.querySelector('.win-body');
    body.classList.add('doc-body');
    body.innerHTML = '<pre class="doc-text">'+escapeHtml(
      "OCTAVO CORTE\nSistema de recuperación de datos\n\nEste equipo perteneció a *****.\nSe desconoce el motivo por el cual quedó encendido.\n\nEspacio libre en disco: no disponible\nÚltima verificación de integridad: incompleta"
    )+'</pre>';
  };
  document.getElementById('menu-close-all').onclick = function(){
    startMenu.classList.remove('open');
    document.querySelectorAll('.window').forEach(function(w){ closeWindow(w.id); });
  };
  document.addEventListener('click', function(e){
    if(!startMenu.contains(e.target) && e.target!==startBtn){ startMenu.classList.remove('open'); }
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){
      const active = document.querySelector('.window.active');
      if(active) closeWindow(active.id);
    }
  });

  setTimeout(function(){
    spawnError("Bienvenido de nuevo. Última sesión no cerrada correctamente.");
  }, 3500);
}

/* ============================================================
   SECUENCIA DE ARRANQUE
   ============================================================ */
const BOOT_LINES = [
  "OCTAVO CORTE — SISTEMA DE RECUPERACIÓN DE DATOS",
  "",
  "Comprobando integridad del disco...............OK (3 sectores dañados)",
  "Cargando perfil de usuario: *****",
  "Último acceso registrado: hace demasiado tiempo",
  "",
  "ADVERTENCIA: se detectaron archivos modificados después del último cierre de sesión conocido.",
  "",
  "Cargando escritorio..."
];

function runBoot(){
  const el = document.getElementById('boot-text');
  const enterBtn = document.getElementById('boot-enter');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function finish(){
    enterBtn.style.display = 'inline-block';
  }

  if(reduced){
    el.textContent = BOOT_LINES.join('\n');
    finish();
    return;
  }

  let li=0, ci=0;
  function step(){
    if(li>=BOOT_LINES.length){ finish(); return; }
    const line = BOOT_LINES[li];
    if(ci<=line.length){
      const prev = BOOT_LINES.slice(0,li).join('\n');
      el.textContent = (li>0 ? prev+'\n' : '') + line.slice(0,ci);
      ci++;
      setTimeout(step, line.length===0 ? 90 : 12);
    } else {
      li++; ci=0;
      setTimeout(step, 140);
    }
  }
  step();
}

document.getElementById('boot-enter').addEventListener('click', function(){
  document.getElementById('boot').classList.add('hidden');
  document.getElementById('desktop').hidden = false;
  playBeep(520, 0.09);
  initDesktop();
});

runBoot();

})();
</script>
